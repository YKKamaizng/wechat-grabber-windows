name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PyInstaller
        run: python -m pip install -r requirements.txt

      - name: Smoke test Windows API types
        run: python -c "import app; assert app.wintypes.HGLOBAL; assert app.wintypes.LPVOID; print('Windows API type smoke test passed')"

      - name: Build single EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WeChatGrabber app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGrabber-Windows
          path: dist/WeChatGrabber.exe
          if-no-files-found: error
